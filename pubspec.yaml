name: eda_restaurant
description: Premium restaurant partner / merchant app — Eda Kitchen
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  dio: ^5.8.0+1
  socket_io_client: ^3.1.2
  connectivity_plus: ^6.1.4

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  rive: ^0.13.20
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  skeletonizer: ^2.0.1
  fl_chart: ^0.71.0
  gap: ^3.0.1

  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6

  image_picker: ^1.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  vibration: ^3.1.3
  wakelock_plus: ^1.2.10
  audioplayers: ^6.4.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/rive/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app.png
  adaptive_icon_background: "#FFD60A"
  adaptive_icon_foreground: assets/images/app.png
  remove_alpha_ios: true
